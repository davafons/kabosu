name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cargo-cache: true

      - name: Build gem
        run: gem build kabosu.gemspec

      - name: Push to RubyGems
        uses: rubygems/release-gem@v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" &>/dev/null; then
            echo "Release $VERSION_TAG already exists, uploading assets to it"
            gh release upload "$VERSION_TAG" kabosu-*.gem --clobber
          else
            gh release create "$VERSION_TAG" kabosu-*.gem \
              --title "$VERSION_TAG" \
              --generate-notes
          fi
